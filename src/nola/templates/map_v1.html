<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<script src="https://unpkg.com/h3-js@^4.1.0"></script>
<script src="https://unpkg.com/deck.gl@^9.0.0/dist.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root { --ink:#1f1f1d; --ink2:#4a4945; --muted:#6b6a66; --line:#e6e5e1; --surface:#ffffff; --bg:#f7f6f3; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:12px 16px 8px; background:var(--surface); border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0 0 8px; font-weight:600; }
  .filters { display:flex; flex-wrap:wrap; gap:12px; align-items:end; }
  .filters label { display:flex; flex-direction:column; gap:2px; font-size:11px; color:var(--muted); }
  select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); min-width:120px; }
  .stat { margin-left:auto; text-align:right; }
  .stat b { font-size:18px; display:block; font-variant-numeric: tabular-nums; }
  .stat span { font-size:11px; color:var(--muted); }
  #wrap { position:absolute; top:92px; bottom:0; left:0; right:0; }
  #map { position:absolute; inset:0; }
  #legend { position:absolute; left:12px; bottom:24px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px; z-index:2; min-width:180px; }
  #legend .t { font-size:11px; color:var(--muted); margin-bottom:4px; }
  #legend .row { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink2); font-variant-numeric: tabular-nums; }
  #legend .sw { width:14px; height:10px; border-radius:2px; }
  #tablebtn { position:absolute; right:12px; top:12px; z-index:2; font:inherit; padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  #table { position:absolute; right:12px; top:44px; z-index:2; background:#fff; border:1px solid var(--line); border-radius:8px; max-height:60%; overflow:auto; display:none; }
  #table table { border-collapse:collapse; font-size:11px; font-variant-numeric: tabular-nums; }
  #table th, #table td { padding:4px 8px; border-bottom:1px solid var(--line); text-align:right; }
  #table th:first-child, #table td:first-child { text-align:left; }
  .note { font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <div class="filters">
    <label>Year<select id="f-year"></select></label>
    <label>Call category<select id="f-cat"></select></label>
    <label>Time of day<select id="f-tod"></select></label>
    <label>NOPD district<select id="f-dist"></select></label>
    <label>Measure<select id="f-metric">
      <option value="count">Calls</option>
      <option value="pc">Calls per 1,000 residents</option>
    </select></label>
    <div class="stat"><b id="total">–</b><span id="sub">calls in view</span></div>
  </div>
</header>
<div id="wrap">
  <div id="map"></div>
  <button id="tablebtn">Table view</button>
  <div id="table"></div>
  <div id="legend"></div>
</div>
<script>
const DATA = /*__DATA__*/null;
const RAMP = ["#cde2fb", "#86b6ef", "#3987e5", "#1c5cab", "#0d366b"];   // sequential blue, light -> dark
const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
const RAMP_RGB = RAMP.map(hex2rgb);
const fmt = new Intl.NumberFormat("en-US", {maximumFractionDigits: 1});

function fill(id, items, allLabel) {
  const el = document.getElementById(id);
  el.innerHTML = `<option value="-1">${allLabel}</option>` +
    items.map((v, i) => `<option value="${i}">${v}</option>`).join("");
  return el;
}
const fy = fill("f-year", DATA.years, "All years");
const fc = fill("f-cat", DATA.cats.map(c => c.replace(/_/g, " ")), "All categories");
const ft = fill("f-tod", DATA.tods, "All hours");
const dists = [...new Set(DATA.district.filter(d => d !== null))].sort((a, b) => a - b);
const fd = document.getElementById("f-dist");
fd.innerHTML = `<option value="-1">All districts</option>` + dists.map(d => `<option value="${d}">District ${d}</option>`).join("");
const fm = document.getElementById("f-metric");
const hasPop = DATA.pop.some(p => p !== null);
if (!hasPop) { fm.querySelector('[value="pc"]').disabled = true; }

function aggregate() {
  const y = +fy.value, c = +fc.value, t = +ft.value, d = +fd.value;
  const counts = new Float64Array(DATA.hexes.length);
  for (const [h, yi, ci, ti, n] of DATA.rows) {
    if ((y < 0 || yi === y) && (c < 0 || ci === c) && (t < 0 || ti === t)) counts[h] += n;
  }
  const out = [];
  let total = 0;
  counts.forEach((n, i) => {
    if (!n) return;
    if (d >= 0 && DATA.district[i] !== d) return;
    const pop = DATA.pop[i];
    const pc = pop !== null && pop >= DATA.min_pop ? n / pop * 1000 : null;
    total += n;
    out.push({hex: DATA.hexes[i], n, pop, pc, district: DATA.district[i]});
  });
  return {rows: out, total};
}

function quantileBreaks(values, k) {
  const v = values.filter(x => x !== null && isFinite(x)).sort((a, b) => a - b);
  if (!v.length) return [];
  return Array.from({length: k - 1}, (_, i) => v[Math.floor((i + 1) * v.length / k)]);
}
const binOf = (x, br) => { let b = 0; while (b < br.length && x > br[b]) b++; return b; };

const map = new maplibregl.Map({
  container: "map",
  style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
  center: [-90.03, 29.98], zoom: 10.8
});
map.addControl(new maplibregl.NavigationControl({showCompass: false}), "bottom-right");
const deckgl = new deck.MapboxOverlay({
  interleaved: false,
  getTooltip: ({object}) => object && {
    html: `<b>District ${object.district ?? "–"}</b><br>${fmt.format(object.n)} calls` +
          (object.pc !== null ? `<br>${fmt.format(object.pc)} per 1,000 residents` : "") +
          (object.pop !== null ? `<br><span style="color:#6b6a66">pop. ≈ ${fmt.format(object.pop)}</span>` : "") +
          `<br><span style="color:#6b6a66">${object.hex}</span>`,
    style: {background: "#fff", color: "#1f1f1d", border: "1px solid #e6e5e1", borderRadius: "6px", fontSize: "12px", padding: "6px 8px"}
  }
});
map.addControl(deckgl);

function render() {
  const {rows, total} = aggregate();
  const metric = fm.value === "pc" && hasPop ? "pc" : "count";
  const val = r => metric === "pc" ? r.pc : r.n;
  const breaks = quantileBreaks(rows.map(val), RAMP.length);
  const shown = rows.filter(r => val(r) !== null);

  deckgl.setProps({layers: [new deck.H3HexagonLayer({
    id: "hex", data: shown, pickable: true, filled: true, extruded: false,
    stroked: true, getLineColor: [255, 255, 255], lineWidthMinPixels: 1,
    getHexagon: r => r.hex,
    getFillColor: r => [...RAMP_RGB[binOf(val(r), breaks)], 200],
    updateTriggers: {getFillColor: [fy.value, fc.value, ft.value, fd.value, fm.value]}
  })]});

  document.getElementById("total").textContent = fmt.format(total);
  document.getElementById("sub").textContent = `calls in view · ${shown.length} hexes (res ${DATA.res})`;
  const lo = [0, ...breaks], hi = [...breaks, Math.max(...shown.map(val), 0)];
  document.getElementById("legend").innerHTML =
    `<div class="t">${metric === "pc" ? "Calls per 1,000 residents" : "Calls per hex"} (quintiles)</div>` +
    RAMP.map((c, i) => `<div class="row"><span class="sw" style="background:${c}"></span>${fmt.format(lo[i] ?? 0)} – ${fmt.format(hi[i] ?? 0)}</div>`).join("") +
    (metric === "pc" ? `<div class="note">Hexes under ${DATA.min_pop} residents hidden</div>` : "");

  const top = [...shown].sort((a, b) => val(b) - val(a)).slice(0, 25);
  document.getElementById("table").innerHTML = `<table><tr><th>Hex</th><th>District</th><th>Calls</th><th>Per 1k</th></tr>` +
    top.map(r => `<tr><td>${r.hex}</td><td>${r.district ?? "–"}</td><td>${fmt.format(r.n)}</td><td>${r.pc === null ? "–" : fmt.format(r.pc)}</td></tr>`).join("") + `</table>`;
}

[fy, fc, ft, fd, fm].forEach(el => el.addEventListener("change", render));
document.getElementById("tablebtn").addEventListener("click", () => {
  const t = document.getElementById("table");
  t.style.display = t.style.display === "block" ? "none" : "block";
});
render();
</script>
</body>
</html>
